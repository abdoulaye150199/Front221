<div class="login-wrapper">
  
  <div class="login-left-panel">
    <div class="branding-section">
      <div class="logo-wrapper">
        <img src="/assets/image/image.png" alt="Ecole 221 Logo" class="logo-image" />
      </div>
      <h1 class="brand-title">Ecole 221</h1>
      <p class="brand-subtitle">Plateforme de gestion scolaire</p>
    </div>

    
    <div class="features-section">
      <div class="feature-item" [innerHTML]="icons.features.secure"></div>
      <div class="feature-item" [innerHTML]="icons.features.tracking"></div>
      <div class="feature-item" [innerHTML]="icons.features.dashboard"></div>
    </div>
  </div>

  
  <div class="login-right-panel">
    <div class="login-header">
      <img src="/assets/image/image.png" alt="Ecole 221 Logo" class="header-logo-image" />
    </div>

    <div class="login-content">
      <p class="welcome-text">Bienvenue sur <span class="brand-highlight">ECOLE 221</span></p>
      <h2 class="login-title">Se connecter</h2>

      
      <button type="button" class="google-signin-btn" aria-label="Se connecter avec Google">
        <span [innerHTML]="icons.google"></span>
        <span>Sign in with Google</span>
      </button>

      
      <div class="divider">
        <span>ou</span>
      </div>

      
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        
        <div class="form-group">
          <label for="phone-email">Entrez votre numéro de téléphone ou votre email</label>
          <div class="input-wrapper">
            <span class="input-icon" [innerHTML]="icons.email"></span>
            <input
              id="phone-email"
              type="text"
              formControlName="phoneOrEmail"
              autocomplete="username"
              inputmode="email"
              aria-describedby="phone-email-error"
              [attr.aria-invalid]="phoneOrEmailErrorMessage ? 'true' : null"
              placeholder="Téléphone ou email"
              class="form-input"
            />
          </div>
          <span id="phone-email-error" class="error-message" *ngIf="phoneOrEmailErrorMessage">
            {{ phoneOrEmailErrorMessage }}
          </span>
        </div>

        
        <div class="form-group">
          <label for="password">Entrez votre mot de passe</label>
          <div class="input-wrapper">
            <span class="input-icon" [innerHTML]="icons.password"></span>
            <input
              id="password"
              [type]="passwordFieldType"
              formControlName="password"
              autocomplete="current-password"
              aria-describedby="password-error"
              [attr.aria-invalid]="passwordErrorMessage ? 'true' : null"
              placeholder="Mot de passe"
              class="form-input"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-pressed]="showPassword"
              [attr.aria-label]="
                showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
              "
            >
              <span [innerHTML]="icons.passwordEye"></span>
            </button>
          </div>
          <button type="button" class="forgot-password-link" aria-disabled="true">
            Mot de passe oublié ?
          </button>
          <span id="password-error" class="error-message" *ngIf="passwordErrorMessage">
            {{ passwordErrorMessage }}
          </span>
        </div>

        
        <div class="error-alert" role="alert" aria-live="assertive" *ngIf="loginError">
          <span [innerHTML]="icons.error"></span>
          <span>{{ loginError }}</span>
        </div>

        
        <button
          type="submit"
          class="login-button"
          [disabled]="loginForm.invalid || isLoading"
          [attr.aria-busy]="isLoading"
        >
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading" class="loading-text">Connexion en cours...</span>
        </button>
      </form>

      
      <p class="login-footer">© 2025 Ecole 221 — Tous droits réservés</p>
    </div>
  </div>
</div>
